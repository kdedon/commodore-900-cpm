; CCP.CFG -- console command processor options.  Every line is optional;
; with no CCP.CFG at all the CCP behaves exactly as the stock DRI one.
; The four keywords it understands are PATH, DIR, ERROR and FLOW, each
; documented by the comment above it here.

; Command search path: ordered drive/user groups tried in turn.
;   d      a drive letter A-P, or * for the drive now selected
;   U      a user number 0-15, or * for the user now selected
; "* *0 A5" = the current user, then user 0 (the stock order),
; then user area 5 of drive A.
PATH * *0 A5

; Named directories: NAME: stands for a drive + user area.
DIR DEV=A5
DIR HOME=A0

; Command run when a command cannot be resolved; it is handed the
; failing line as its command tail.
ERROR OOPS

; Recognize IF/ELSE/FI in submit files.
FLOW ON
