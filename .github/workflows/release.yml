# release -- on a v* tag, publish what somebody installs: the bootable disk,
# the system file, and the two drive images.
#
# Built HERE, from the tag, rather than taken from the build workflow's run: a
# release asset has to come from the tag it claims to be.  It is the same
# `make all', against the toolchain and kboot releases DEPS names.  The banner
# carries the build date, so the tag's own run is the one whose bytes are
# published.
#
# The edges are resolved ONCE, in the deps job, and handed to the jobs after
# it as an artifact: `latest' is read a single time, so everything in the
# release was built against the same releases.
#
# The whole verify suite (`make verify-all') runs in its own job beside the
# build, and nothing is published unless it passes.
#
# The images are sparse files of tens of megabytes that are mostly zeros, so
# they are published gzipped.  cpma.img is not published: it is the
# development drive A:, with the verify suite's guest halves on it.
# cpma-rel.img is the one without them, and it is what cpmonly.bin carries.
#
# A DISPATCH RUN IS NOT A RELEASE.  It has no tag; it builds and uploads the
# assets for inspection, and publishes nothing.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compiler
        run: make deps DEP=toolchain
      - name: The loader, and the handoff header the BIOS compiles
        run: make deps DEP=kboot
      - name: The emulator the verify suite boots
        run: make deps DEP=emu
      # A tar because the toolchain release carries symlinks and executables.
      - name: Pack the edges
        run: tar -cf cpm-deps.tar deps
      - uses: actions/upload-artifact@v4
        with:
          name: cpm-deps
          path: cpm-deps.tar
          retention-days: 7

  build:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cpm-deps }
      - name: Restore the edges
        run: tar -xpf cpm-deps.tar

      - name: Build the system, the images and the boot disk
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/deps/commodore-900-kboot
        run: make all

      - name: Package
        run: |
          mkdir -p dist
          cp build/cpm.sys dist/
          for f in cpmonly.bin cpma-rel.img cpmb.img; do
            gzip -9 -c "build/$f" > "dist/$f.gz"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      # What built the published bytes, so it is answerable once the
      # workspace is gone.
      - name: Release notes
        run: |
          cat deps/commodore-900-toolchain/.provenance
          {
            echo "Built with commodore-900-toolchain v$(sed -n 's/^version=//p' deps/commodore-900-toolchain/.provenance) and commodore-900-kboot v$(cat deps/commodore-900-kboot/VERSION)."
          } > dist/NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: cpm-release
          path: dist/
          if-no-files-found: error

  # The whole suite, against the same tag and the same edges as `build'.  It
  # runs beside `build', and `publish' needs both: a failing suite publishes
  # nothing.
  verify:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: cpm-deps }
      - name: Restore the edges
        run: tar -xpf cpm-deps.tar
      - name: cpmtools
        run: sudo apt-get update -q && sudo apt-get install -y -q cpmtools
      # Four at a time: the runner has four vCPUs.
      - name: The verify suite
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/deps/commodore-900-kboot
          EMU: ${{ github.workspace }}/deps/commodore-900-emulator
        run: make verify-all VERIFYJOBS=4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-logs
          path: |
            build/verify-run/
            build/verify-*.log
          retention-days: 7

  publish:
    needs: [build, verify]
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to attach assets to the release
    steps:
      - uses: actions/download-artifact@v4
        with: { name: cpm-release, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cpmonly.bin.gz
            dist/cpm.sys
            dist/cpma-rel.img.gz
            dist/cpmb.img.gz
            dist/SHA256SUMS
          body_path: dist/NOTES.md
          fail_on_unmatched_files: true
