# release -- on a v* tag, publish what somebody installs: the bootable disk,
# the system file, and the two drive images.
#
# Built HERE, from the tag, rather than taken from the build workflow's run: a
# release asset has to come from the tag it claims to be.  It is the same
# `make all', against the same pinned toolchain and kboot releases DEPS names.
# The banner carries the build date, so the tag's own run is the one whose
# bytes are published.
#
# The images are sparse files of tens of megabytes that are mostly zeros, so
# they are published gzipped.  cpma.img is not published: it is the
# development drive A:, with the verify suite's guest halves on it.
# cpma-rel.img is the one without them, and it is what cpmonly.bin carries.
name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write          # to attach assets to the release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The compiler
        run: make deps DEP=toolchain
      - name: The loader, and the handoff header the BIOS compiles
        run: make deps DEP=kboot

      # What built the published bytes, in the run log and in the release
      # notes, so it is answerable once the workspace is gone.
      - name: What is in it
        id: notes
        run: |
          cat deps/commodore-900-toolchain/.provenance
          {
            echo 'notes<<EOF'
            echo "Built with commodore-900-toolchain v$(sed -n 's/^version=//p' deps/commodore-900-toolchain/.provenance) and commodore-900-kboot v$(cat deps/commodore-900-kboot/VERSION)."
            echo
            echo 'cpmonly.bin is the bootable disk: kboot, cpm.sys, and drives A: and B:.'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build the system, the images and the boot disk
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/deps/commodore-900-kboot
        run: make all

      - name: Package
        run: |
          mkdir -p dist
          cp build/cpm.sys dist/
          for f in cpmonly.bin cpma-rel.img cpmb.img; do
            gzip -9 -c "build/$f" > "dist/$f.gz"
          done
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cpmonly.bin.gz
            dist/cpm.sys
            dist/cpma-rel.img.gz
            dist/cpmb.img.gz
            dist/SHA256SUMS
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true
