# build -- the two freestanding links, against the toolchain this repository
# floats on.
#
# CPM.SYS and split.mod each carry their own startup and their own runtime:
# no crts0.s, no kernel symbol table behind them.  So every external symbol
# the compiler names is one this tree has to define itself (SS, the stack
# segment a frame reference relocates against, in src/bios/crt.s and
# src/bdos/splitent.s).  A compiler change that adds one is invisible here
# until somebody builds.  The toolchain runs the same links from its own side
# on every push; this is the other direction, for a change made here.
#
# The two freestanding links are named as their own step FIRST, because that
# is the step whose failure is an unresolved symbol and nothing else: a link
# error found there needs no reading to interpret.  `make all' then follows,
# and it is what the rest of a release is actually made of -- every transient
# program, the devpack staging, all three packed images, the release staging
# with its exclusions (which is where tests/relcheck.sh runs), imagecheck and
# farptrcheck.  Without it CI never built a single transient, never packed an
# image and never ran relcheck at all, so the thing relcheck asserts was
# checked by no automation anywhere.
#
# `make all' IS NOT A GATE ON THE NETWORK, and that is the constraint it was
# written against.  The only fetches are the deps job's `make deps' steps for
# the two releases it compiles with, the toolchain and kboot (the BIOS
# compiles kboot's bootinfo.h, and the boot medium carries its loader), and
# the emulator release the verify job boots; `all' itself fetches nothing.  So this step fails for a compile, staging,
# packing or exclusion fault and for nothing else.
#
# The verify job boots: it runs the part of `make verify-all' that the
# push's changed files can affect, as tests/cisel.sh reads them -- nothing for
# a docs-only change, a few targets for a guest-shim or src/app change, and
# the whole suite for anything touching the system or anything it does not
# recognise.  The first push of a branch runs the whole suite.  A tag push
# skips it here: release.yml runs the whole suite for a tag.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # The edges, resolved ONCE.  `latest' is read here and nowhere else, and the
  # unpacked releases travel to every job as one artifact, so each job builds
  # against the same releases and none asks GitHub again.  A tar because the
  # toolchain release carries symlinks and executables.
  # ---------------------------------------------------------------------------
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A RELEASE of the toolchain, not a checkout: DEPS names the release,
      # and `make deps' is the one path that resolves it, the same as a
      # developer building this tree gets.
      - name: The toolchain this system is built with
        run: make deps DEP=toolchain
      - name: The loader, and the handoff header the BIOS compiles
        run: make deps DEP=kboot
      # A published binary, with the ROM and disk it boots from: nothing to
      # build.  Only the verify job uses it.
      - name: The emulator the verify suite boots
        run: make deps DEP=emu

      - name: Pack the edges
        run: tar -cf cpm-deps.tar deps

      - uses: actions/upload-artifact@v4
        with:
          name: cpm-deps
          path: cpm-deps.tar
          retention-days: 7

  link:
    needs: deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: cpm }
      - uses: actions/download-artifact@v4
        with: { name: cpm-deps, path: cpm }
      - name: Restore the edges
        working-directory: cpm
        run: tar -xpf cpm-deps.tar

      # Set, never searched: a job that depended on directory adjacency breaks
      # the first time a runner image moves its checkouts.  The search has its
      # own test in resolver-isolation.yml.
      - name: Link the resident system and the split-I/D module
        working-directory: cpm
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/cpm/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/cpm/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/cpm/deps/commodore-900-kboot
        run: make build/cpm.sys build/split.mod

      # Everything else a release is made of: the transient programs, the
      # staged devpack, the three images, the RELEASE staging and its
      # exclusion check (tests/relcheck.sh, run by the $(CPMARIMG) recipe),
      # imagecheck and farptrcheck.  No network: see the header.
      - name: Transients, staging, images and the release exclusions
        working-directory: cpm
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/cpm/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/cpm/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/cpm/deps/commodore-900-kboot
        run: make all

      # relcheck's own answer, on a build that got that far.  Printed, not
      # asserted: the assertion is relcheck's exit status inside `make all'.
      - name: What the release staging came out as
        if: always()
        working-directory: cpm
        run: |
          if [ -d build/diska ] && [ -d build/diska-rel ]; then
            printf 'development %s files, release %s\n' \
              "$(ls -1 build/diska | wc -l)" \
              "$(ls -1 build/diska-rel | wc -l)"
          fi

      - name: The compiler's own log, when it does not
        if: failure()
        working-directory: cpm
        run: cat build/build.log build/obj/link.txt build/obj/modlink.txt 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # The verify suite, narrowed to what this push can affect.  Beside `link',
  # not after it: `make verify-all' builds `all' first, so a compile fault
  # fails both, and neither waits for the other.
  # ---------------------------------------------------------------------------
  verify:
    needs: deps
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      # The whole history, so the push's BEFORE commit is there to diff.
      - uses: actions/checkout@v4
        with: { path: cpm, fetch-depth: 0 }

      # The workflow computes the diff; tests/cisel.sh only reads the list.
      # No BEFORE (a branch's first push, all zeros, a dispatch run) or one
      # git cannot diff against (a force push) runs everything.
      - name: What this push can affect
        id: sel
        working-directory: cpm
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CREATED: ${{ github.event.created }}
          BASE: ${{ github.event.pull_request.base.sha }}
          AFTER: ${{ github.sha }}
        run: |
          case $EVENT in
          push)         from=$BEFORE ;;
          pull_request) from=$BASE ;;
          *)            from= ;;
          esac
          [ "$CREATED" = true ] && from=
          [ -n "$(printf '%s' "$from" | tr -d 0)" ] || from=
          if [ -n "$from" ] && files=$(git diff --name-only "$from" "$AFTER"); then
            printf '%s\n' "$files"
            targets=$(printf '%s\n' "$files" | sh tests/cisel.sh)
          else
            targets=all
          fi
          echo "verify: ${targets:-nothing}"
          echo "set=$targets" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.sel.outputs.set != ''
        with: { name: cpm-deps, path: cpm }
      - name: Restore the edges
        if: steps.sel.outputs.set != ''
        working-directory: cpm
        run: tar -xpf cpm-deps.tar

      # The independent CP/M 3 directory reader dirfmt-check and
      # verify-stamped check the format against.
      - name: cpmtools
        if: steps.sel.outputs.set != ''
        run: sudo apt-get update -q && sudo apt-get install -y -q cpmtools

      # Four at a time: the runner has four vCPUs.
      - name: The verify suite
        if: steps.sel.outputs.set != ''
        working-directory: cpm
        env:
          C900_TOOLCHAIN: ${{ github.workspace }}/cpm/deps/commodore-900-toolchain
          KBOOT: ${{ github.workspace }}/cpm/deps/commodore-900-kboot/kboot
          KBOOTSRC: ${{ github.workspace }}/cpm/deps/commodore-900-kboot
          EMU: ${{ github.workspace }}/cpm/deps/commodore-900-emulator
          SET: ${{ steps.sel.outputs.set }}
        run: |
          if [ "$SET" = all ]; then
            make verify-all VERIFYJOBS=4
          else
            make verify-all VERIFYJOBS=4 VERIFYSET="$SET"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verify-logs
          path: |
            cpm/build/verify-run/
            cpm/build/verify-*.log
          retention-days: 7
